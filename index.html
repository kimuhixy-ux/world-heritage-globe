<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>世界遺産グローブ</title>
<link rel="canonical" href="https://kimuhixy.com/world-heritage-globe/">
<link rel="alternate" hreflang="ja" href="https://kimuhixy.com/world-heritage-globe/">
<link rel="alternate" hreflang="en" href="https://kimuhixy.com/world-heritage-globe/en/">
<link rel="alternate" hreflang="x-default" href="https://kimuhixy.com/world-heritage-globe/">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070f">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="世界遺産グローブ">
</head>
<body>
  <div id="globe-container"></div>

  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">読み込み中です…</p>
    <p class="loading-note">1,258件のデータを地球儀上に描画するため、初回表示までに時間がかかる場合があります。しばらくお待ちください。</p>
  </div>

  <header id="app-header">
    <div class="header-top-row">
      <h1>世界遺産グローブ</h1>
      <button id="visited-counter" type="button" aria-label="訪問済み一覧を開く">
        🏛 <span id="visited-count">0</span> / <span id="visited-total">0</span>
      </button>
    </div>
    <div id="filter-bar">
      <div id="category-toggles">
        <button type="button" class="filter-chip active" data-category="Cultural">文化</button>
        <button type="button" class="filter-chip active" data-category="Natural">自然</button>
        <button type="button" class="filter-chip active" data-category="Mixed">複合</button>
        <button type="button" class="filter-chip" id="danger-toggle">⚠ 危機遺産のみ</button>
      </div>
      <input type="search" id="search-input" placeholder="物件名・国名で検索" autocomplete="off">
    </div>
  </header>

  <button id="info-btn" title="このアプリについて" aria-label="このアプリについて">ℹ️</button>

  <div id="info-modal" class="modal-overlay" hidden>
    <div class="modal-panel">
      <button id="info-modal-close" class="modal-close" aria-label="閉じる">✕</button>
      <h2>世界遺産グローブ</h2>
      <p class="modal-desc">ユネスコ世界遺産1,258件を回転する3D地球儀上で探索できるPWAです。</p>
      <ul class="modal-links">
        <li><a href="about.html">運営者情報</a></li>
        <li><a href="privacy.html">プライバシーポリシー</a></li>
        <li><a href="en/index.html">English</a></li>
      </ul>
    </div>
  </div>

  <div id="card-backdrop"></div>
  <section id="info-card" aria-hidden="true">
    <div class="info-card-handle"></div>
    <button id="card-close" class="card-close" aria-label="閉じる">×</button>
    <p id="card-badge" class="info-card-badge" hidden>今日の世界遺産</p>
    <p id="card-category" class="info-card-category"></p>
    <h2 id="card-name" class="info-card-name"></h2>
    <p id="card-meta" class="info-card-meta"></p>
    <p id="card-description" class="info-card-description"></p>
    <div class="info-card-actions">
      <a id="card-official-link" class="btn btn-primary" href="#" target="_blank" rel="noopener">公式ページを見る</a>
      <a id="card-youtube-link" class="btn btn-secondary" href="#" target="_blank" rel="noopener">YouTubeで見る</a>
      <button id="card-visited-toggle" class="btn btn-secondary" type="button">訪問済みにする</button>
    </div>
  </section>

  <div id="visited-backdrop" class="card-backdrop-like"></div>
  <section id="visited-list" aria-hidden="true">
    <div class="info-card-handle"></div>
    <button id="visited-close" class="card-close" aria-label="閉じる">×</button>
    <h2 class="info-card-name">訪問済み世界遺産</h2>
    <p id="visited-empty" class="info-card-meta">まだ訪問済みの物件はありません。</p>
    <ul id="visited-items"></ul>
  </section>

  <section id="timeline-bar">
    <button id="timeline-play" aria-label="再生">▶</button>
    <input type="range" id="timeline-slider" min="1978" max="2026" value="2026" step="1" aria-label="登録年">
    <div id="timeline-info">
      <span id="timeline-year">2026年</span>
      <span id="timeline-count">0件</span>
    </div>
  </section>

  <script src="https://unpkg.com/globe.gl"></script>
  <script src="js/i18n.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-info.js"></script>
  <script src="js/donate.js"></script>
  <script src="js/ads.js"></script>
</body>
</html>
